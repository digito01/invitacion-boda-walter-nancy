<style>
  /* =========================================================
     ╔═══════════════════════════════════════════════════════╗
     ║  ZONA EDITABLE #1 — COLORES Y TIPOGRAFÍA               ║
     ║  Cambia estos valores para ajustar la paleta.          ║
     ╚═══════════════════════════════════════════════════════╝
  ========================================================= */
  :root{
    --navy-deep:#4a0911;
    --navy:#680c17;
    --navy-soft:#8a2b37;
    --cream:#e3dbc6;
    --blush:#d9cfb4;
    --paper:#ede6d3;
    --gold:#ad8a5c;
    --ink:#2b2722;
    --ink-soft:#4d463c;
    --line:rgba(104,12,23,0.18);
    --font-display:'Playfair Display', serif;
    --font-body:'EB Garamond', serif;
    --font-label:'Cormorant Garamond', serif;
    --font-script:'Great Vibes', cursive;
    --radius:2px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy-deep);
    font-family:var(--font-body);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  img{max-width:100%;display:block;}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;}

  /* ---------- layout shell (simulates a phone card on desktop) ---------- */
  #stage{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    position:relative;
    background:var(--cream);
    box-shadow:0 0 60px rgba(0,0,0,0.4);
    overflow:hidden;
  }

  /* ---------- envelope intro ---------- */
  #envelope-screen{
    position:fixed;inset:0;
    max-width:480px;margin:0 auto;
    background:linear-gradient(160deg, var(--navy-deep), var(--navy));
    display:flex;align-items:center;justify-content:center;
    z-index:100;
    cursor:pointer;
    transition:opacity .9s ease, visibility .9s ease;
  }
  #envelope-screen.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  .envelope{
    position:relative;
    width:78%;
    max-width:320px;
    aspect-ratio:3/2;
    perspective:1000px;
  }
  .env-body{
    position:absolute;inset:0;
    background:linear-gradient(155deg,#7a1220,#52090f);
    border-radius:4px;
    box-shadow:0 25px 50px rgba(0,0,0,0.45);
  }
  .env-flap{
    position:absolute;top:0;left:0;right:0;height:62%;
    background:linear-gradient(155deg,#82151f,#5f0c15);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top center;
    transition:transform 1s cubic-bezier(.6,.05,.2,1);
    border-radius:4px 4px 0 0;
    backface-visibility:hidden;
  }
  #envelope-screen.open .env-flap{transform:rotateX(180deg);}
  .env-seal{
    position:absolute;top:50%;left:50%;
    width:70px;height:70px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 30%, #d9bb85, #8f6d3c 70%);
    border-radius:50%;
    box-shadow:0 8px 18px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.15);
    display:flex;align-items:center;justify-content:center;
    z-index:5;
    transition:opacity .5s ease, transform .5s ease;
  }
  #envelope-screen.open .env-seal{opacity:0;transform:translate(-50%,-50%) scale(.6);}
  .env-seal svg{width:34px;height:34px;opacity:.9;}
  .env-monogram{
    position:absolute;bottom:16%;left:50%;transform:translateX(-50%);
    font-family:var(--font-display);
    letter-spacing:2px;
    color:rgba(255,255,255,0.55);
    font-size:15px;
  }
  .env-hint{
    position:absolute;bottom:-46px;left:50%;transform:translateX(-50%);
    color:rgba(255,255,255,0.6);
    font-family:var(--font-label);
    font-size:14px;letter-spacing:2px;text-transform:uppercase;
    white-space:nowrap;
  }
  .env-hint span{display:inline-block;animation:pulse 1.8s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  #admin-entry-link{padding:10px 14px;}

  /* ---------- privacy gate (no valid link) ---------- */
  #gate-screen{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 30px;background:var(--cream);
  }
  #gate-screen h1{font-family:var(--font-display);font-size:22px;color:var(--navy);margin-bottom:12px;}
  #gate-screen p{color:var(--ink-soft);font-size:17px;line-height:1.6;}

  /* ---------- general section styling ---------- */
  .section{
    padding:clamp(48px,9vw,64px) clamp(22px,6vw,32px);
    position:relative;
    text-align:center;
  }
  .section + .section{border-top:1px solid var(--line);}
  .eyebrow{
    font-family:var(--font-label);
    text-transform:uppercase;
    letter-spacing:4px;
    font-size:clamp(12px,3.2vw,13px);
    color:var(--gold);
    margin:0 0 10px;
  }
  .display-title{
    font-family:var(--font-display);
    font-weight:600;
    color:var(--navy);
    font-size:clamp(24px,6.5vw,30px);
    margin:0 0 6px;
    line-height:1.25;
  }
  .script{font-family:var(--font-script);font-size:clamp(26px,7vw,32px);color:var(--gold);}
  .body-text{
    font-family:var(--font-body);
    font-size:clamp(16px,4vw,18px);
    line-height:1.7;
    color:var(--ink-soft);
    max-width:360px;
    margin:0 auto;
  }
  .divider{
    width:44px;height:1px;background:var(--gold);
    margin:22px auto;
  }
  .flourish{width:120px;height:auto;margin:0 auto 18px;opacity:.85;}

  /* ---------- hero ---------- */
  #hero{
    background:linear-gradient(180deg,var(--navy-deep) 0%, var(--navy-deep) 46%, var(--cream) 46%);
    padding-top:max(56px, env(safe-area-inset-top));
    text-align:center;
  }
  .hero-inner{color:#fff;padding-bottom:26px;display:flex;flex-direction:column;align-items:center;padding-left:24px;padding-right:24px;}
  .hero-eyebrow{font-family:var(--font-label);letter-spacing:5px;text-transform:uppercase;font-size:clamp(12px,3.2vw,14px);color:rgba(255,255,255,0.65);margin:0 0 16px;}
  .hero-names{font-family:var(--font-display);font-size:clamp(32px,10vw,42px);line-height:1.18;margin:0;font-weight:600;}
  .hero-and{display:block;font-family:var(--font-script);font-size:clamp(24px,6.5vw,32px);color:var(--gold);margin:2px 0;}
  .guest-line{
    margin-top:24px;font-family:var(--font-label);font-size:clamp(14px,3.6vw,16px);
    color:rgba(255,255,255,0.78);letter-spacing:.8px;line-height:1.6;
    border-top:1px solid rgba(255,255,255,0.18);
    padding-top:16px;
  }
  .guest-line b{color:#fff;font-weight:600;}
  .hero-photo-wrap{padding:0 28px;margin-top:8px;}
  .photo-placeholder{
    width:100%;aspect-ratio:4/5;
    border:1.5px dashed var(--gold);
    background:var(--blush);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);font-family:var(--font-label);font-size:14px;
    text-align:center;padding:20px;line-height:1.5;
    border-radius:var(--radius);
  }
  .hero-photo-wrap img{border-radius:var(--radius);width:100%;aspect-ratio:4/5;object-fit:cover;}
  .countdown{
    display:flex;justify-content:center;gap:clamp(8px,3vw,16px);margin:30px 0 8px;
    flex-wrap:wrap;padding:0 8px;
  }
  .cd-box{min-width:56px;flex:0 1 64px;}
  .cd-num{font-family:var(--font-display);font-size:clamp(22px,6vw,28px);color:var(--navy);font-variant-numeric:tabular-nums;}
  .cd-label{font-family:var(--font-label);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);margin-top:2px;}
  .wedding-date{font-family:var(--font-label);font-size:clamp(14px,3.8vw,16px);letter-spacing:2px;color:var(--navy);margin-top:10px;}

  /* ---------- parents ---------- */
  .parents-grid{display:flex;justify-content:center;gap:clamp(24px,8vw,40px);margin-top:18px;flex-wrap:wrap;}
  .parents-col{min-width:130px;}
  .parents-col p{font-family:var(--font-body);font-size:clamp(15px,4vw,17px);color:var(--ink);margin:2px 0;}
  .parents-col .role{font-family:var(--font-label);font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}

  /* ---------- ceremony / reception cards ---------- */
  .venue-icon{width:38px;height:38px;margin:0 auto 14px;color:var(--navy);}
  .venue-time{font-family:var(--font-display);font-size:clamp(20px,5.5vw,22px);color:var(--navy);margin:8px 0 14px;}
  .venue-name{font-weight:600;font-size:clamp(17px,4.5vw,18px);color:var(--ink);}
  .venue-address{font-size:clamp(15px,4vw,16px);color:var(--ink-soft);margin:6px 0 20px;max-width:320px;margin-left:auto;margin-right:auto;}
  .map-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;
    border:1px solid var(--navy);color:var(--navy);
    padding:10px 26px;font-family:var(--font-label);
    letter-spacing:1.5px;text-transform:uppercase;font-size:13px;
    text-decoration:none;border-radius:var(--radius);
    transition:background .25s, color .25s;
  }
  .map-btn:hover{background:var(--navy);color:#fff;}
  .map-btn:active{background:var(--navy);color:#fff;}

  /* ---------- timeline ---------- */
  #timeline{background:var(--blush);}
  .tl-item{position:relative;padding-bottom:38px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-line{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:1px;height:calc(100% - 20px);background:var(--gold);opacity:.5;}
  .tl-item:last-child .tl-line{display:none;}
  .tl-icon{width:32px;height:32px;margin:0 auto 10px;color:var(--navy);position:relative;z-index:2;background:var(--blush);}
  .tl-time{font-family:var(--font-display);font-size:clamp(17px,4.5vw,19px);color:var(--navy);}
  .tl-label{font-family:var(--font-label);letter-spacing:3px;text-transform:uppercase;font-size:13px;color:var(--ink-soft);margin-top:2px;}

  /* ---------- dress code / gifts ---------- */
  .info-chip{
    display:inline-block;border:1px solid var(--gold);color:var(--navy);
    padding:9px 22px;font-family:var(--font-label);letter-spacing:1px;
    border-radius:20px;font-size:15px;margin-top:14px;min-height:40px;line-height:22px;
  }
  .palette-dots{display:flex;justify-content:center;gap:10px;margin-top:18px;}
  .palette-dots span{width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,0.1);display:inline-block;}

  /* ---------- gallery placeholder ---------- */
  .gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;}
  .gallery-grid .photo-placeholder{aspect-ratio:1/1;font-size:12px;}

  /* ---------- RSVP ---------- */
  #rsvp{background:var(--navy-deep);color:#fff;}
  #rsvp .eyebrow{color:var(--gold);}
  #rsvp .display-title{color:#fff;}
  .rsvp-card{
    background:var(--paper);color:var(--ink);
    border-radius:8px;padding:clamp(24px,6vw,30px) clamp(18px,5vw,24px);margin-top:26px;
    text-align:left;
  }
  .rsvp-pass-line{
    text-align:center;font-family:var(--font-label);font-size:15px;color:var(--ink-soft);
    margin-bottom:22px;letter-spacing:.5px;
  }
  .rsvp-pass-line b{color:var(--navy);}
  .field{margin-bottom:18px;}
  .field label{display:block;font-family:var(--font-label);font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px;}
  .field select, .field input, .field textarea{
    width:100%;padding:13px 14px;border:1px solid var(--line);
    background:var(--cream);font-family:var(--font-body);font-size:16px;
    border-radius:6px;color:var(--ink);min-height:48px;
  }
  .field textarea{resize:vertical;min-height:80px;}
  .field select, .field input, .field textarea{
    -webkit-appearance:none;appearance:none;
  }
  .field select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%236b6459' stroke-width='1.5' fill='none'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;padding-right:34px;
  }
  .submit-btn{
    width:100%;padding:15px;min-height:50px;background:var(--navy);color:#fff;border:none;
    font-family:var(--font-label);letter-spacing:2px;text-transform:uppercase;font-size:14px;
    border-radius:6px;margin-top:8px;transition:background .2s;
  }
  .submit-btn:hover{background:var(--navy-soft);}
  .submit-btn:active{background:var(--navy-soft);}
  .cal-wrap{margin-top:16px;text-align:center;}
  .cal-btn{background:none;border:1px solid var(--navy);color:var(--navy);padding:10px 22px;border-radius:2px;font-family:var(--font-label);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-size:13px;cursor:pointer;min-height:44px;}
  .cal-menu{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px;}
  .cal-menu a{border:1px solid var(--gold);color:var(--navy);padding:9px 16px;border-radius:20px;font-family:var(--font-label);font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;}
  .rsvp-summary{font-family:var(--font-label);font-weight:700;font-size:15px;color:var(--navy);margin:0 0 16px;line-height:1.5;}
  .rsvp-edit-btn{background:none;border:1px solid var(--navy);color:var(--navy);padding:10px 22px;border-radius:2px;font-family:var(--font-label);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-size:13px;cursor:pointer;min-height:44px;}
  .rsvp-error{color:#b23c3c;font-size:14px;text-align:center;margin:0 0 12px;}
  .rsvp-success{text-align:center;padding:24px 6px;}
  .rsvp-success .check{width:46px;height:46px;margin:0 auto 14px;color:var(--gold);}

  /* ---------- footer ---------- */
  #footer{padding:clamp(34px,8vw,40px) 30px calc(50px + env(safe-area-inset-bottom));color:rgba(255,255,255,0.55);background:var(--navy-deep);text-align:center;}
  #footer .script{color:var(--gold);}
  #footer .hashtag{font-family:var(--font-label);letter-spacing:2px;margin-top:8px;font-size:14px;}

  /* ---------- admin ---------- */
  #admin-root{max-width:900px;margin:0 auto;padding:30px 20px 80px;font-family:var(--font-body);background:var(--cream);min-height:100vh;}
  #admin-root h1{font-family:var(--font-display);color:var(--navy);}
  .admin-card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:22px;margin-bottom:24px;}
  .admin-card h2{font-family:var(--font-display);font-size:20px;color:var(--navy);margin-top:0;}
  .admin-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .admin-field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:160px;}
  .admin-field label{font-size:13px;color:var(--ink-soft);}
  .admin-field input{padding:10px;border:1px solid var(--line);border-radius:4px;font-size:15px;}
  .admin-btn{background:var(--navy);color:#fff;border:none;padding:11px 20px;border-radius:4px;font-size:14px;letter-spacing:.5px;}
  .admin-btn.secondary{background:var(--gold);}
  .admin-link-box{
    margin-top:14px;padding:12px 14px;background:var(--blush);border-radius:4px;
    font-size:14px;word-break:break-all;display:flex;justify-content:space-between;gap:10px;align-items:center;
  }
  table.admin-table{width:100%;border-collapse:collapse;font-size:14px;}
  table.admin-table th, table.admin-table td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;}
  table.admin-table th{color:var(--ink-soft);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.5px;}
  .status-pill{padding:3px 10px;border-radius:12px;font-size:12px;display:inline-block;}
  .status-yes{background:#dcefe0;color:#2c7a43;}
  .status-no{background:#f4dede;color:#b23c3c;}
  .status-pending{background:#eee;color:#888;}
  .admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  .admin-pass-gate{max-width:340px;margin:100px auto;text-align:center;padding:30px;background:#fff;border-radius:6px;border:1px solid var(--line);}
  .admin-pass-gate input{width:100%;padding:10px;margin:14px 0;border:1px solid var(--line);border-radius:4px;}
  .small-note{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
  .empty-state{color:var(--ink-soft);font-size:14px;padding:18px 0;text-align:center;}

  .admin-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .admin-stat{flex:1;min-width:92px;background:var(--cream);border:1px solid var(--line);border-radius:6px;padding:10px 12px;text-align:center;}
  .admin-stat strong{display:block;font-family:var(--font-display);font-size:22px;color:var(--navy);line-height:1.2;}
  .admin-stat span{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;}
  .admin-stat.yes strong{color:#2c7a43;}
  .admin-stat.no strong{color:#b23c3c;}
  .admin-stat.pending strong{color:#8a7a4a;}
  .admin-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .admin-toolbar input[type="text"]{flex:2;min-width:200px;padding:10px;border:1px solid var(--line);border-radius:4px;font-size:14px;}
  .admin-toolbar select{flex:1;min-width:140px;padding:10px;border:1px solid var(--line);border-radius:4px;font-size:14px;background:#fff;}
  .admin-table-wrap{overflow-x:auto;}
  .admin-pager{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:16px;}
  .admin-pager-info{font-size:13px;color:var(--ink-soft);}
  .admin-pager button:disabled{opacity:.4;}


  /* ---- Texto más grueso y legible ---- */
  body{font-weight:500;}
  .body-text{font-weight:500;}
  .parents-col p, .venue-address{font-weight:500;}
  .eyebrow, .hero-eyebrow, .cd-label, .tl-label, .field label, .parents-col .role,
  .wedding-date, .guest-line, .map-btn, .rsvp-pass-line, #footer .hashtag,

// ---------- almacenamiento con respaldo (Claude / Firebase / localStorage) ----------
const hasCloudStorage = () => (typeof window.storage !== "undefined" && window.storage !== null);
const FS_COLLECTION = "boda";
function fsSafeId(key){ return key.replace(/\//g, "__slash__"); }

async function storeGet(key, shared=true){
  try{
    if(hasCloudStorage()){
      const r = await window.storage.get(key, shared);
      return r ? JSON.parse(r.value) : null;
    } else if(firestoreDB){
      const doc = await firestoreDB.collection(FS_COLLECTION).doc(fsSafeId(key)).get();
      return doc.exists ? doc.data().value : null;
    } else {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    }
  }catch(e){ console.error("storeGet error", key, e); return null; }
}
async function storeSet(key, value, shared=true){
  try{
    if(hasCloudStorage()){
      await window.storage.set(key, JSON.stringify(value), shared);
    } else if(firestoreDB){
      await firestoreDB.collection(FS_COLLECTION).doc(fsSafeId(key)).set({ key: key, value: value });
    } else {
      localStorage.setItem(key, JSON.stringify(value));
    }
    return true;
  }catch(e){ console.error("storeSet error", key, e); return false; }
}
async function storeList(prefix, shared=true){
  try{
    if(hasCloudStorage()){
      const r = await window.storage.list(prefix, shared);
      return r ? r.keys : [];
    } else if(firestoreDB){
      const snap = await firestoreDB.collection(FS_COLLECTION)
        .where("key", ">=", prefix)
        .where("key", "<", prefix + "")
        .get();
      return snap.docs.map(d => d.data().key);
    } else {
      return Object.keys(localStorage).filter(k => k.startsWith(prefix));
    }
  }catch(e){ console.error("storeList error", prefix, e); return []; }
}
async function storeDelete(key, shared=true){
  try{
    if(hasCloudStorage() && window.storage.delete){
      await window.storage.delete(key, shared);
    } else if(firestoreDB){
      await firestoreDB.collection(FS_COLLECTION).doc(fsSafeId(key)).delete();
    } else {
      localStorage.removeItem(key);
    }
    return true;
  }catch(e){ console.error("storeDelete error", key, e); return false; }
}

// ---------- utilidades ----------
function qs(name){ return new URLSearchParams(window.location.search).get(name); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- resolución del invitado a partir del link ----------
async function resolveGuest(){
  const id = qs("id");
  const nombre = qs("invitado");
  const pases = qs("pases");

  if(id){
    const g = await storeGet("guests:" + id, true);
    if(g) return g;
    return null; // link con id pero no existe -> invitación inválida
  }
  if(nombre){
    // modo rápido manual, sin guardar en el panel admin
    return { id: null, name: decodeURIComponent(nombre.replace(/\+/g," ")), passes: pases ? parseInt(pases) : 1 };

  return null;
}

    ? `<p class="rsvp-summary">${data.attending} ${parseInt(data.attending)==1?'persona confirmada':'personas confirmadas'}${data.names?`<br>${esc(data.names)}`:''}</p>`

    : `<p class="small-note" style="text-align:center;">El plazo para modificar tu respuesta ha terminado.</p>`;

      <p class="body-text" style="margin:0 0 10px;">${esc(msg)}</p>

}

async function initRsvp(guest){
  const card = document.getElementById("rsvp-card");
  if(!card) return;
  const closed = rsvpIsClosed();
  const key = "rsvps:" + (guest.id || "");
  let prev = guest.id ? await storeGet(key, true) : null;

  function showForm(prefill){
    card.innerHTML = rsvpFormHtml(guest);
    const attend = document.getElementById("f-attend");
    const namesWrap = document.getElementById("f-names-wrap");
    const names = document.getElementById("f-names");
    function sync(){
      const no = attend.value === "0";
      namesWrap.style.display = no ? "none" : "";
      names.required = !no && attend.value !== "";
    }
    attend.addEventListener("change", sync);
    if(prefill){
      attend.value = prefill.attending;
      names.value = prefill.names || "";
      document.getElementById("f-phone").value = prefill.phone || "";
      document.getElementById("f-message").value = prefill.message || "";
    }
    sync();
    document.getElementById("rsvp-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("rsvp-submit");
      const err = document.getElementById("rsvp-error");
      err.style.display = "none";
      btn.disabled = true; btn.textContent = "Enviando…";
      const data = {
        guestId: guest.id,
        guestName: guest.name,
        attending: attend.value,
        names: attend.value === "0" ? "" : names.value,
        phone: document.getElementById("f-phone").value,
        message: document.getElementById("f-message").value,
        respondedAt: new Date().toISOString()
      };
      const ok = await storeSet("rsvps:" + (guest.id || uid()), data, true);
      if(!ok){
        err.textContent = "No pudimos guardar tu respuesta. Revisa tu conexión e inténtalo de nuevo.";
        err.style.display = "block";
        btn.disabled = false; btn.textContent = "Enviar confirmación";
        return;
      }
      prev = guest.id ? data : null;
      showResult(data, guest.id ? !rsvpIsClosed() : false);
    });
  }

  function showResult(data, canEdit){
    card.innerHTML = rsvpResultHtml(data, canEdit);
    const eb = document.getElementById("rsvp-edit");
    if(eb) eb.addEventListener("click", () => showForm(data));
  }

  if(prev){
    showResult(prev, !closed);
  } else if(closed){
    card.innerHTML = `<div class="rsvp-success"><p class="body-text" style="margin:0;">El plazo para confirmar asistencia ha terminado. Si aún necesitas avisar a los novios, comunícate con ellos directamente.</p></div>`;
  } else {
    showForm(null);
  }
}

// ---------- agregar al calendario ----------
function calendarEvent(){
  // La hora de CONFIG.weddingDate se interpreta en horario de Honduras (UTC-6, sin horario de verano)
  const start = new Date(CONFIG.weddingDate + "-06:00");
  const end = new Date(start.getTime() + 6*3600*1000);
  const fmt = d => d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const c = CONFIG.ceremony, r = CONFIG.reception;
  const title = `Boda de ${CONFIG.couple.groom} y ${CONFIG.couple.bride}`;
  const place = [c.venueName, (c.address||"").trim()].filter(Boolean).join(", ");
  const details = `Ceremonia: ${c.time} · ${c.venueName}\nRecepción: ${r.time} · ${r.venueName}${r.address?` (${r.address.trim()})`:""}`;
  return { title, place, details, start: fmt(start), end: fmt(end) };
}
function setupCalendar(){
  const toggle = document.getElementById("cal-toggle");
  if(!toggle) return;
  const ev = calendarEvent();
  document.getElementById("cal-google").href =
    "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(ev.title) +
    "&dates=" + ev.start + "/" + ev.end +
    "&details=" + encodeURIComponent(ev.details) +
    "&location=" + encodeURIComponent(ev.place);
  toggle.addEventListener("click", () => {
    const m = document.getElementById("cal-menu");
    m.style.display = m.style.display === "none" ? "flex" : "none";
  });
  document.getElementById("cal-ics").addEventListener("click", (e) => {
    e.preventDefault();
    const esc2 = t => t.replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
    const ics = [
      "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Invitacion Boda//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH",
      "BEGIN:VEVENT",
      "UID:boda-" + ev.start + "@invitacion",
      "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""),
      "DTSTART:" + ev.start, "DTEND:" + ev.end,
      "SUMMARY:" + esc2(ev.title),
      "LOCATION:" + esc2(ev.place),
      "DESCRIPTION:" + esc2(ev.details),
      "BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:Mañana es la boda","END:VALARM",
      "END:VEVENT","END:VCALENDAR"
    ].join("\r\n");
    const blob = new Blob([ics], {type:"text/calendar;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "boda.ics";
    document.body.appendChild(a); a.click(); a.remove();
  });
}

function startCountdown(){
  const target = new Date(CONFIG.weddingDate).getTime();
  const box = document.getElementById("countdown");
  const dateLabel = document.getElementById("wedding-date-label");
  if(!box) return;
  dateLabel.textContent = new Date(CONFIG.weddingDate).toLocaleDateString("es-ES", {day:'numeric', month:'long', year:'numeric'});

  function tick(){
    const now = Date.now();
    let diff = Math.max(0, target - now);
    const d = Math.floor(diff/86400000);
    const h = Math.floor((diff%86400000)/3600000);
    const m = Math.floor((diff%3600000)/60000);
    const s = Math.floor((diff%60000)/1000);
    box.innerHTML = [
      [d,"Días"],[h,"Horas"],[m,"Min"],[s,"Seg"]
    ].map(([v,l]) => `<div class="cd-box"><div class="cd-num">${String(v).padStart(2,'0')}</div><div class="cd-label">${l}</div></div>`).join("");
  }
  tick();
  setInterval(tick, 1000);
}

// ---------- configuración: cargar (mezclando con valores por defecto) y guardar ----------
// Las fotos se guardan en documentos aparte porque Firestore limita cada documento a 1 MiB.
function deepMerge(base, over){
  if(Array.isArray(over) || over === null || typeof over !== "object") return over === undefined ? base : over;
  const out = (base && typeof base === "object" && !Array.isArray(base)) ? {...base} : {};
  for(const k of Object.keys(over)) out[k] = deepMerge(out[k], over[k]);
  return out;
}
async function loadConfig(){
  const main = await storeGet("site-config", true);
  if(!main) return;
  const merged = deepMerge(CONFIG_DEFAULTS, main);
  const hero = await storeGet("site-hero", true);
  const gal = await storeGet("site-gallery", true);
  if(hero && typeof hero.photo === "string") merged.hero.heroPhoto = hero.photo;
  if(gal && Array.isArray(gal.photos)) merged.gallery.photoUrls = gal.photos;
  CONFIG = merged;
}
async function saveConfig(){
  const copy = JSON.parse(JSON.stringify(CONFIG));
  const heroPhoto = (copy.hero && copy.hero.heroPhoto) || "";
  const photos = (copy.gallery && copy.gallery.photoUrls) || [];
  if(copy.hero) copy.hero.heroPhoto = "";
  if(copy.gallery) copy.gallery.photoUrls = [];
  const r1 = await storeSet("site-config", copy, true);
  const r2 = await storeSet("site-hero", { photo: heroPhoto }, true);
  const r3 = await storeSet("site-gallery", { photos }, true);
  const ok = r1 && r2 && r3;
  if(!ok) alert("No se pudo guardar en la nube. Si subiste muchas fotos, elimina algunas (el límite es de unas 7 fotos en la galería) e inténtalo de nuevo.");
  return ok;
}

async function boot(){

  if(qs("admin") === "1" || qs("admin") === "true"){

    // El sobre igual se puede tocar; al abrirse revela el mensaje de invitación privada.
    setupEnvelope(() => revealTarget("gate-screen", "flex"));
    return;
  }

  await renderInvitation(guest);
  setupEnvelope(() => revealTarget("stage", "block"));
}

// Convierte una foto subida por el usuario en un dataURL comprimido (sin necesitar un link externo)
function fileToCompressedDataURL(file, maxDim=1400, quality=0.82){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("No se pudo leer el archivo"));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error("No se pudo procesar la imagen"));
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

  galToggle.checked = !!CONFIG.gallery.enabled;

    CONFIG.gallery.enabled = galToggle.checked;

  function renderGalleryGrid(){
    const grid = document.getElementById("gallery-photo-grid");
    const photos = CONFIG.gallery.photoUrls || [];
    if(!photos.length){
      grid.innerHTML = `<span class="small-note">Aún no has subido fotos.</span>`;

    }
    grid.innerHTML = photos.map((src, i) => `
      <div style="position:relative;">
        <img src="${src}" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:4px;">
        <button data-idx="${i}" class="remove-gallery-photo" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;">×</button>
      </div>`).join("");
    grid.querySelectorAll(".remove-gallery-photo").forEach(btn => {
      btn.addEventListener("click", async () => {
        const idx = parseInt(btn.dataset.idx);
        CONFIG.gallery.photoUrls.splice(idx, 1);
        await saveConfig();
        renderGalleryGrid();
        syncJsonEditor();

    if(!files.length) return;
    const msg = document.getElementById("gallery-photo-msg");

      }catch(err){ /* ignora archivos que fallen */ }
    }
    await saveConfig();
    renderGalleryGrid();
    syncJsonEditor();
    msg.textContent = "Guardadas ✓";
    setTimeout(()=> msg.textContent = "", 2500);
  });
}

let guestsCache = [];
let guestsPage = 1;
let guestsSearch = "";
let guestsStatusFilter = "all";
const GUESTS_PAGE_SIZE = 10;

async function loadGuestsTable(){
  const container = document.getElementById("guests-table");
  container.innerHTML = `<p class="empty-state">Cargando…</p>`;
  const keys = await storeList("guests:", true);
  const items = [];
  for(const k of keys){
    const g = await storeGet(k, true);
    if(!g) continue;
    const rsvp = g.id ? await storeGet("rsvps:" + g.id, true) : null;
    const statusKey = rsvp ? (parseInt(rsvp.attending) > 0 ? "yes" : "no") : "pending";
    items.push({ g, rsvp, statusKey });
  }
  items.sort((a,b) => (b.g.createdAt||"").localeCompare(a.g.createdAt||""));
  guestsCache = items;
  guestsPage = 1;
  renderGuestsTable();
}

function filterGuestsSearch(value){
  guestsSearch = value;
  guestsPage = 1;
  renderGuestsTable({ keepFocus: "guests-search" });
}
function filterGuestsStatus(value){
  guestsStatusFilter = value;
  guestsPage = 1;
  renderGuestsTable();
}
function goToGuestsPage(n){
  guestsPage = n;
  renderGuestsTable();
  document.getElementById("guests-table").scrollIntoView({behavior:"smooth", block:"start"});
}

function renderGuestsTable(opts){
  const container = document.getElementById("guests-table");
  if(!guestsCache.length){
    container.innerHTML = `<p class="empty-state">Aún no has generado invitaciones. Usa el formulario de arriba.</p>`;
    return;
  }

  const totalGuests = guestsCache.length;
  const confirmedCount = guestsCache.filter(x => x.statusKey === "yes").length;
  const declinedCount = guestsCache.filter(x => x.statusKey === "no").length;
  const pendingCount = guestsCache.filter(x => x.statusKey === "pending").length;
  const totalPassesConfirmed = guestsCache.reduce((sum,x) => sum + (x.statusKey === "yes" ? parseInt(x.rsvp.attending) : 0), 0);

  const q = guestsSearch.trim().toLowerCase();
  const filtered = guestsCache.filter(({g, rsvp, statusKey}) => {
    if(guestsStatusFilter !== "all" && statusKey !== guestsStatusFilter) return false;
    if(q){
      const haystack = `${g.name} ${rsvp?rsvp.names||"":""} ${rsvp?rsvp.phone||"":""}`.toLowerCase();
      if(!haystack.includes(q)) return false;
    }
    return true;
  });

  const totalPages = Math.max(1, Math.ceil(filtered.length / GUESTS_PAGE_SIZE));
  if(guestsPage > totalPages) guestsPage = totalPages;
  const startIdx = (guestsPage - 1) * GUESTS_PAGE_SIZE;
  const pageItems = filtered.slice(startIdx, startIdx + GUESTS_PAGE_SIZE);

  let rows = "";
  for(const {g, rsvp, statusKey} of pageItems){
    let status = `<span class="status-pill status-pending">Pendiente</span>`;
    if(statusKey === "yes") status = `<span class="status-pill status-yes">Asiste (${rsvp.attending})</span>`;
    if(statusKey === "no") status = `<span class="status-pill status-no">No asiste</span>`;
    const url = `${adminBaseUrl()}?id=${g.id}`;
    rows += `<tr>
      <td>${esc(g.name)}</td>
      <td>${g.passes}</td>
      <td>${status}</td>
      <td>${rsvp ? esc(rsvp.names||"") : "-"}</td>
      <td>${rsvp ? esc(rsvp.phone||"") : "-"}</td>
      <td style="white-space:nowrap;">
        <button class="admin-btn" style="padding:6px 12px;font-size:12px;" onclick="navigator.clipboard.writeText('${url}')">Copiar link</button>
        <button class="admin-btn" style="padding:6px 12px;font-size:12px;background:#b23c3c;margin-left:6px;" onclick="deleteGuest('${g.id}', '${esc(g.name).replace(/'/g, "\\'")}')">Eliminar</button>
      </td>
    </tr>`;
  }
  if(!rows){
    rows = `<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--ink-soft);">No se encontraron invitados con ese filtro o búsqueda.</td></tr>`;
  }

  let pager = "";
  if(totalPages > 1){
    pager = `<div class="admin-pager">
      <button class="admin-btn secondary" style="padding:6px 14px;font-size:12px;" ${guestsPage<=1?"disabled":""} onclick="goToGuestsPage(${guestsPage-1})">‹ Anterior</button>
      <span class="admin-pager-info">Página ${guestsPage} de ${totalPages} · ${filtered.length} resultado${filtered.length===1?"":"s"}</span>
      <button class="admin-btn secondary" style="padding:6px 14px;font-size:12px;" ${guestsPage>=totalPages?"disabled":""} onclick="goToGuestsPage(${guestsPage+1})">Siguiente ›</button>
    </div>`;
  }

  container.innerHTML = `
    <div class="admin-stats">
      <div class="admin-stat"><strong>${totalGuests}</strong><span>Invitaciones</span></div>
      <div class="admin-stat yes"><strong>${confirmedCount}</strong><span>Confirmados</span></div>
      <div class="admin-stat no"><strong>${declinedCount}</strong><span>No asisten</span></div>
      <div class="admin-stat pending"><strong>${pendingCount}</strong><span>Pendientes</span></div>
      <div class="admin-stat"><strong>${totalPassesConfirmed}</strong><span>Personas confirmadas</span></div>
    </div>
    <div class="admin-toolbar">
      <input type="text" id="guests-search" placeholder="Buscar por nombre o teléfono…" value="${esc(guestsSearch)}" oninput="filterGuestsSearch(this.value)">
      <select id="guests-filter" onchange="filterGuestsStatus(this.value)">
        <option value="all" ${guestsStatusFilter==="all"?"selected":""}>Todos los estados</option>
        <option value="yes" ${guestsStatusFilter==="yes"?"selected":""}>Confirmados</option>
        <option value="no" ${guestsStatusFilter==="no"?"selected":""}>No asisten</option>
        <option value="pending" ${guestsStatusFilter==="pending"?"selected":""}>Pendientes</option>
      </select>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>Invitado</th><th>Pases</th><th>Estado</th><th>Asistentes</th><th>Teléfono</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${pager}
  `;

  if(opts && opts.keepFocus){
    const el = document.getElementById(opts.keepFocus);
    if(el){ el.focus(); const v = el.value; el.value=""; el.value=v; }
  }
}

async function exportExcel(){
  const keys = await storeList("guests:", true);
  const data = [];
  for(const k of keys){
    const g = await storeGet(k, true);
    if(!g) continue;
    const rsvp = g.id ? await storeGet("rsvps:" + g.id, true) : null;
    data.push({
      "Invitado": g.name,
      "Pases asignados": g.passes,
      "Confirmó": rsvp ? (parseInt(rsvp.attending) > 0 ? "Sí" : "No") : "Sin responder",
      "Personas que asisten": rsvp ? rsvp.attending : "",
      "Nombre de asistentes": rsvp ? rsvp.names : "",
      "Teléfono": rsvp ? rsvp.phone : "",
      "Mensaje": rsvp ? rsvp.message : "",
      "Fecha de respuesta": rsvp ? rsvp.respondedAt : "",
      "Link de invitación": `${adminBaseUrl()}?id=${g.id}`
    });
  }
  if(!data.length){ alert("No hay invitados registrados todavía."); return; }
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Invitados");
  XLSX.writeFile(wb, `Invitados_${CONFIG.couple.groom}_${CONFIG.couple.bride}.xlsx`);
}
</script>
